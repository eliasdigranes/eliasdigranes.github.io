<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasino - 50/50 Mines Spill</title>
    <link rel="stylesheet" href="stylesmines.css">
</head>
<body>
    <h1>Kasino 💎 Mines Spill</h1>
    <p>Klikk på en av boksene for å teste lykken! Vil du treffe diamanten eller minen?</p>
    
    <div id="game-container">
        <div class="box" data-type="hidden"></div>
        <div class="box" data-type="hidden"></div>
    </div>
    
    <p id="result-message"></p>
    
    <button id="reset-btn">Spill igjen</button>

    <!-- ny seksjon for saldo og innsats -->
    <div id="balance-container">
        <p>Saldo: <span id="balance">1000</span> NOK</p>
        <label for="bet-amount">Innsats:</label>
        <input type="number" id="bet-amount" min="1" placeholder="Din innsats">
        <button id="place-bet-btn">Plasser innsats</button>
    </div>

    <script src="kodemines.js"></script>
</body>
</html>
